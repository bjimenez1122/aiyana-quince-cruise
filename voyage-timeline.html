<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voyage Planner — Aiyana's Quinceañera at Sea</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0a1626;          /* midnight hull */
    --ink-2:#0f2138;        /* panel */
    --ink-3:#16304f;        /* raised */
    --gold:#d4b06a;         /* champagne gold */
    --gold-soft:#b9954f;
    --cream:#f4ecdc;        /* warm cream text */
    --muted:#8ea2bd;        /* sea-mist muted */
    --line:rgba(212,176,106,.22);
    --done:#d4b06a;
    --next:#f0d9a0;
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Mulish',sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(212,176,106,.10), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(56,108,168,.18), transparent 60%),
      var(--ink);
    color:var(--cream);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:48px 20px;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- starfield ---- */
  .stars{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .stars i{position:absolute;color:var(--gold);font-size:11px;opacity:.0;animation:twinkle 6s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:.55;transform:scale(1)}}

  .planner{
    position:relative;z-index:1;
    width:min(980px,100%);
    background:linear-gradient(180deg, rgba(15,33,56,.92), rgba(10,22,38,.92));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:38px clamp(22px,4vw,46px) 30px;
    box-shadow:0 40px 90px -40px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.04);
  }

  /* ---- header ---- */
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:34px}
  .eyebrow{font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .eyebrow::before,.eyebrow::after{content:"";height:1px;width:26px;background:linear-gradient(90deg,transparent,var(--gold))}
  .eyebrow::before{background:linear-gradient(90deg,var(--gold),transparent)}
  h1{font-family:'Marcellus',serif;font-weight:400;font-size:clamp(28px,4.4vw,40px);line-height:1.05;letter-spacing:.01em}
  .sub{color:var(--muted);font-size:14.5px;margin-top:9px;max-width:46ch}
  .togo{
    text-align:right;flex-shrink:0;border:1px solid var(--line);border-radius:14px;
    padding:14px 20px;background:rgba(212,176,106,.05);
  }
  .togo b{font-family:'Marcellus',serif;font-size:38px;color:var(--gold);display:block;line-height:1}
  .togo span{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}

  /* ============ DESKTOP HORIZONTAL TIMELINE ============ */
  .rail{position:relative;display:none;padding:74px 2% 8px}
  @media(min-width:760px){.rail{display:block}}
  .track{position:absolute;left:2%;right:2%;top:74px;height:3px;background:rgba(255,255,255,.09);border-radius:3px}
  .track .fill{position:absolute;left:0;top:0;height:100%;width:0;background:linear-gradient(90deg,var(--gold-soft),var(--gold));border-radius:3px;box-shadow:0 0 14px rgba(212,176,106,.5);transition:width 1.4s cubic-bezier(.2,.8,.2,1)}

  .ship{position:absolute;top:74px;transform:translate(-50%,-50%);z-index:5;text-align:center;opacity:0;animation:rise .7s ease forwards .9s}
  .ship .dot{width:18px;height:18px;border-radius:50%;background:var(--cream);border:3px solid var(--gold);margin:0 auto;box-shadow:0 0 0 6px rgba(212,176,106,.18),0 0 22px rgba(212,176,106,.6);position:relative}
  .ship .dot::after{content:"⚓";position:absolute;inset:0;display:grid;place-items:center;font-size:9px;color:var(--ink)}
  .ship .tag{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);background:var(--gold);padding:6px 12px;border-radius:20px;font-weight:700;white-space:nowrap;box-shadow:0 12px 24px -10px rgba(212,176,106,.9);text-align:center}
  .ship .tag::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--gold)}
  .ship .tag small{display:block;font-weight:600;letter-spacing:.04em;text-transform:none;font-size:10px;color:rgba(10,22,38,.7);margin-top:1px}

  .nodes{position:relative;display:flex;justify-content:space-between}
  .node{width:22%;text-align:center;opacity:0;transform:translateY(14px);animation:rise .6s ease forwards}
  .node .pin{width:22px;height:22px;border-radius:50%;margin:0 auto 18px;background:var(--ink-3);border:2px solid rgba(255,255,255,.18);display:grid;place-items:center;position:relative;z-index:2}
  .node.done .pin{background:var(--gold);border-color:var(--gold)}
  .node.done .pin::after{content:"✓";font-size:12px;color:var(--ink);font-weight:700}
  .node.next .pin{border-color:var(--gold);background:var(--ink)}
  .node.next .pin::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:1.5px solid var(--gold);animation:pulse 2s ease-out infinite}
  .node.dest .pin{background:transparent;border-color:var(--gold)}
  .node.dest .pin::after{content:"✦";font-size:12px;color:var(--gold)}

  .date{font-family:'Marcellus',serif;font-size:19px;letter-spacing:.06em;color:var(--cream)}
  .date .yr{color:var(--muted);font-size:13px}
  .ttl{font-weight:700;font-size:14px;margin:7px 0 6px;line-height:1.3}
  .desc{font-size:12.5px;color:var(--muted);line-height:1.5;padding:0 6px}
  .meta{margin-top:11px;display:inline-flex;flex-direction:column;gap:5px;align-items:center}
  .badge{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;padding:4px 11px;border-radius:20px}
  .b-done{color:var(--gold);background:rgba(212,176,106,.12);border:1px solid var(--line)}
  .b-next{color:var(--ink);background:var(--gold)}
  .b-up{color:var(--muted);background:rgba(142,162,189,.1);border:1px solid rgba(142,162,189,.2)}
  .b-dest{color:var(--gold);background:transparent;border:1px solid var(--gold)}
  .out{font-size:11px;color:var(--muted);opacity:.8}
  .node.upcoming .date,.node.upcoming .ttl{opacity:.82}
  .node.dest{width:24%}

  /* ============ MOBILE VERTICAL TIMELINE ============ */
  .vrail{position:relative;padding-left:40px}
  @media(min-width:760px){.vrail{display:none}}
  .vrail::before{content:"";position:absolute;left:13px;top:8px;bottom:18px;width:3px;background:rgba(255,255,255,.09);border-radius:3px}
  .vrail .vfill{position:absolute;left:13px;top:8px;width:3px;background:linear-gradient(180deg,var(--gold-soft),var(--gold));border-radius:3px;box-shadow:0 0 12px rgba(212,176,106,.5);transition:height 1.4s ease}
  .vitem{position:relative;padding:0 0 26px}
  .vpin{position:absolute;left:-32px;top:2px;width:20px;height:20px;border-radius:50%;background:var(--ink-3);border:2px solid rgba(255,255,255,.18);display:grid;place-items:center;z-index:2}
  .vitem.done .vpin{background:var(--gold);border-color:var(--gold)}
  .vitem.done .vpin::after{content:"✓";font-size:11px;color:var(--ink);font-weight:700}
  .vitem.next .vpin{border-color:var(--gold);background:var(--ink)}
  .vitem.next .vpin::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--gold);animation:pulse 2s ease-out infinite}
  .vitem.dest .vpin{border-color:var(--gold)}
  .vitem.dest .vpin::after{content:"✦";font-size:11px;color:var(--gold)}
  .vtoday{position:relative;margin:-6px 0 24px;padding:10px 14px;background:var(--gold);color:var(--ink);border-radius:12px;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;box-shadow:0 12px 26px -12px rgba(212,176,106,.9)}
  .vtoday::before{content:"⚓";position:absolute;left:-37px;top:50%;transform:translateY(-50%);width:20px;height:20px;background:var(--cream);border:3px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:8px;color:var(--ink)}
  .vtoday small{font-weight:600;text-transform:none;letter-spacing:0;font-size:12px;opacity:.8}
  .vdate{font-family:'Marcellus',serif;font-size:17px;letter-spacing:.05em}
  .vdate .yr{color:var(--muted);font-size:13px}
  .vttl{font-weight:700;font-size:14.5px;margin:4px 0 5px}
  .vdesc{font-size:12.5px;color:var(--muted);line-height:1.5}
  .vmeta{margin-top:9px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}

  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.9);opacity:0}}

  .foot{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px}
  .foot .reserve{color:var(--ink);background:var(--gold);padding:9px 18px;border-radius:30px;font-weight:700;text-decoration:none;font-size:12.5px;letter-spacing:.04em;transition:transform .2s}
  .foot .reserve:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<section class="planner">
  <div class="head">
    <div>
      <div class="eyebrow">✦ Voyage Planner</div>
      <h1>Before We Set Sail</h1>
      <p class="sub">Your key dates between now and embarkation — at a glance. Here's what's done and what's coming up.</p>
    </div>
    <div class="togo">
      <b id="togoNum">—</b>
      <span>days to go</span>
    </div>
  </div>

  <!-- DESKTOP -->
  <div class="rail">
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="ship" id="ship">
      <div class="dot"></div>
      <div class="tag">You are here<small id="shipDate">Today</small></div>
    </div>
    <div class="nodes" id="nodes"></div>
  </div>

  <!-- MOBILE -->
  <div class="vrail" id="vrail"><div class="vfill" id="vfill"></div></div>

  <div class="foot">
    <span>Aug 28 – Sep 2, 2026 · Disney Fantasy · Port Canaveral</span>
    <a class="reserve" href="https://disneycruise.disney.go.com/">Reserve ✦</a>
  </div>
</section>

<script>
  /* ---------- data ---------- */
  const SAIL = new Date(2026,7,28);          // Aug 28, 2026
  const milestones = [
    { date:'2026-05-30', daysOut:90, title:'Final Payment Due',
      desc:'Stateroom balance is due to Disney Cruise Line.' },
    { date:'2026-06-14', daysOut:75, title:'Activities & Excursions Open',
      desc:'Book Port Adventures, onboard activities, dining & spa.' },
    { date:'2026-07-29', daysOut:30, title:'Check-In & Princess Gathering',
      desc:'Online check-in, choose a boarding time, and sign up for the Princess Gathering meet & greet.' },
    { date:'2026-08-28', title:'Set Sail', destination:true,
      desc:'Embarkation day at Port Canaveral aboard the Disney Fantasy.' },
  ];

  const MONTHS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const DAY=86400000;
  const today=new Date(); today.setHours(0,0,0,0);

  milestones.forEach(m=>{m.dt=new Date(m.date+'T00:00:00'); m.diff=Math.round((m.dt-today)/DAY);});
  const nextIdx = milestones.findIndex(m=>m.diff>=0);   // first upcoming
  milestones.forEach((m,i)=>{
    m.status = m.destination ? 'dest' : (m.diff<0 ? 'done' : (i===nextIdx ? 'next' : 'upcoming'));
  });

  function fmtDate(d){ return `${MONTHS[d.getMonth()]} ${d.getDate()}`; }
  function relLabel(m){
    if(m.diff<0) return 'Completed';
    if(m.diff===0) return 'Today';
    if(m.diff===1) return 'Tomorrow';
    return `In ${m.diff} days`;
  }
  function badgeClass(s){return {done:'b-done',next:'b-next',upcoming:'b-up',dest:'b-dest'}[s];}
  function badgeText(m){
    if(m.status==='done') return 'Done';
    if(m.status==='next') return 'Up next';
    if(m.status==='dest') return 'Set sail';
    return 'Upcoming';
  }

  /* ---------- countdown ---------- */
  document.getElementById('togoNum').textContent = Math.max(0,Math.round((SAIL-today)/DAY));

  /* ---------- horizontal nodes ---------- */
  const nodesEl=document.getElementById('nodes');
  const n=milestones.length;
  milestones.forEach((m,i)=>{
    const yr = m.destination ? ` <span class="yr">'26</span>` : '';
    const el=document.createElement('div');
    el.className=`node ${m.status}`;
    el.style.animationDelay=(0.3+i*0.15)+'s';
    el.innerHTML=`
      <div class="pin"></div>
      <div class="date">${fmtDate(m.dt)}${yr}</div>
      <div class="ttl">${m.title}</div>
      <div class="desc">${m.desc}</div>
      <div class="meta">
        <span class="badge ${badgeClass(m.status)}">${badgeText(m)}</span>
        <span class="out">${m.destination ? relLabel(m) : (m.daysOut+' days before sailing')}</span>
      </div>`;
    nodesEl.appendChild(el);
  });

  /* ---------- today position on horizontal rail ---------- */
  function railPos(){
    const first=milestones[0].dt, last=milestones[n-1].dt;
    if(today<=first) return 0;
    if(today>=last) return 100;
    let k=0; for(let i=0;i<n-1;i++){ if(today>=milestones[i].dt && today<milestones[i+1].dt){k=i;break;} }
    const seg=1/(n-1);
    const frac=(today-milestones[k].dt)/(milestones[k+1].dt-milestones[k].dt);
    return (k*seg + frac*seg)*100;
  }
  const pos=railPos();
  // map node track to inner 2%..98% to align with .track inset
  const railInner = 2 + pos/100*96;
  document.getElementById('ship').style.left = railInner+'%';
  document.getElementById('shipDate').textContent = fmtDate(today)+", 2026";
  requestAnimationFrame(()=>{ document.getElementById('fill').style.width = pos+'%'; });

  /* ---------- mobile vertical ---------- */
  const vrail=document.getElementById('vrail');
  let inserted=false, doneCount=0;
  milestones.forEach((m,i)=>{
    // insert the "today" marker right before the first upcoming milestone
    if(!inserted && m.diff>=0){
      const t=document.createElement('div');
      t.className='vtoday';
      t.innerHTML=`You are here · Today <small>${fmtDate(today)}, 2026</small>`;
      vrail.appendChild(t);
      inserted=true;
    }
    const it=document.createElement('div');
    it.className=`vitem ${m.status}`;
    const yr = m.destination ? ` <span class="yr">'26</span>` : '';
    it.innerHTML=`
      <div class="vpin"></div>
      <div class="vdate">${fmtDate(m.dt)}${yr}</div>
      <div class="vttl">${m.title}</div>
      <div class="vdesc">${m.desc}</div>
      <div class="vmeta">
        <span class="badge ${badgeClass(m.status)}">${badgeText(m)}</span>
        <span class="out">${m.destination ? relLabel(m) : (m.daysOut+' days before sailing · '+relLabel(m))}</span>
      </div>`;
    vrail.appendChild(it);
    if(m.diff<0) doneCount++;
  });
  if(!inserted){ const t=document.createElement('div'); t.className='vtoday'; t.innerHTML=`You are here · Today <small>${fmtDate(today)}, 2026</small>`; vrail.appendChild(t); }
  // vertical fill height ~ up to the today marker
  setTimeout(()=>{ const total=milestones.length; const h=( (doneCount)/(total-1) )*100; document.getElementById('vfill').style.height=Math.min(100,h*0.9+8)+'%'; },60);

  /* ---------- starfield ---------- */
  const s=document.getElementById('stars');
  for(let i=0;i<26;i++){const star=document.createElement('i');star.textContent='✦';star.style.left=Math.random()*100+'%';star.style.top=Math.random()*100+'%';star.style.fontSize=(7+Math.random()*8)+'px';star.style.animationDelay=(Math.random()*6)+'s';s.appendChild(star);}
</script>
</body>
</html>
